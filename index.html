<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>屁眼王國：克爾文入侵 - RTS 經典重裝版</title>
    <style>
        body { margin: 0; background: #1a1a1a; color: white; font-family: 'Microsoft JhengHei', sans-serif; overflow: hidden; }
        canvas { display: block; background: #2a2a2a; }
        
        /* UI 頂部資訊欄 */
        #top-ui {
            position: absolute; top: 0; left: 0; right: 0; height: 50px;
            background: rgba(0,0,0,0.8); display: flex; align-items: center; padding: 0 20px;
            border-bottom: 2px solid #444; justify-content: space-between;
        }

        /* 側邊經典選單 (紅色警戒風格) */
        #side-menu {
            position: absolute; right: 0; top: 50px; bottom: 0; width: 120px;
            background: rgba(40,40,40,0.9); border-left: 3px solid #666;
            display: flex; flex-direction: column; padding: 10px; gap: 10px; overflow-y: auto;
        }

        .btn {
            width: 100px; height: 60px; background: #444; border: 2px solid #888;
            color: white; cursor: pointer; display: flex; flex-direction: column;
            align-items: center; justify-content: center; font-size: 12px; position: relative;
        }
        .btn:hover { background: #555; border-color: #fff; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn .cost { color: #ffcc00; font-weight: bold; }
        
        /* 冷卻遮罩 */
        .cd-overlay {
            position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.7);
            height: 0%; transition: height 0.1s linear;
        }

        /* 超級武器警示 */
        #super-weapon-alert {
            position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
            color: #ff0000; font-weight: bold; font-size: 24px; display: none;
            text-shadow: 2px 2px #000;
        }
    </style>
</head>
<body>

<div id="top-ui">
    <div>💰 金幣: <span id="gold">0</span> (<span id="income-rate">1</span>/s)</div>
    <div style="color: #00ffff;">🛡️ 王國防禦: <span id="hp">100</span>%</div>
    <div id="super-weapon-txt" style="color: #ff4444;">屁眼大砲：準備中</div>
</div>

<div id="super-weapon-alert">⚠️ 屁眼大砲已就緒 ⚠️</div>

<div id="side-menu">
    <div style="font-size: 12px; color: #aaa; text-align: center;">--- 單位召喚 ---</div>
    <button class="btn" onclick="game.spawnUnit('f1')"><span>屁屁民兵</span><span class="cost">50</span></button>
    <button class="btn" onclick="game.spawnUnit('f2')"><span>直腸弓手</span><span class="cost">100</span></button>
    <button class="btn" onclick="game.spawnUnit('f3')"><span>括約肌騎士</span><span class="cost">200</span></button>
    <button class="btn" onclick="game.spawnUnit('f4')"><span>通暢法師</span><span class="cost">350</span></button>
    <button class="btn" onclick="game.spawnUnit('f5')"><span>國王本人</span><span class="cost">1000</span></button>
    
    <div style="font-size: 12px; color: #aaa; text-align: center;">--- 科技升級 ---</div>
    <button class="btn" style="border-color: #ffcc00;" onclick="game.upgradeIncome()">
        <span>升級金礦</span><span class="cost" id="upgrade-cost">500</span>
    </button>
    <button class="btn" style="border-color: #ff4444;" id="super-btn" onclick="game.fireSuperWeapon()" disabled>
        <span>屁眼大砲</span><span id="super-cd">60s</span>
    </button>
</div>

<canvas id="gameCanvas"></canvas>

<script>
/**
 * 資料定義 (依照你的要求設定)
 */
const ASSETS = {
    friendlies: [
        { id: 'f1', name: '屁屁民兵', img: 'hero_1.png', hp: 50, atk: 8, range: 40, speed: 1.5, cost: 50 },
        { id: 'f2', name: '直腸弓手', img: 'hero_2.png', hp: 40, atk: 15, range: 180, speed: 1.2, cost: 100 },
        { id: 'f3', name: '括約肌騎士', img: 'hero_3.png', hp: 150, atk: 12, range: 40, speed: 0.9, cost: 200, hasShield: true },
        { id: 'f4', name: '通暢法師', img: 'hero_4.png', hp: 60, atk: 40, range: 130, speed: 0.8, cost: 350 },
        { id: 'f5', name: '國王本人', img: 'hero_5.png', hp: 500, atk: 80, range: 50, speed: 0.6, cost: 1000 }
    ],
    enemies: [
        { id: 'e1', name: '克爾文小兵', img: 'enemy_1.png', hp: 45, atk: 6, range: 40, speed: 1.0, reward: 12 },
        { id: 'e2', name: '高速斥侯', img: 'enemy_2.png', hp: 35, atk: 10, range: 40, speed: 2.8, reward: 15 },
        { id: 'e3', name: '重裝步兵', img: 'enemy_3.png', hp: 130, atk: 12, range: 40, speed: 0.7, reward: 35 },
        { id: 'e4', name: '邪惡術士', img: 'enemy_4.png', hp: 55, atk: 25, range: 120, speed: 0.9, reward: 50 },
        { id: 'boss', name: '克爾文大帝', img: 'boss.png', hp: 2000, atk: 100, range: 60, speed: 0.4, reward: 1000, isBoss: true }
    ]
};

const images = {};
function loadImages() {
    [...ASSETS.friendlies, ...ASSETS.enemies].forEach(u => {
        const img = new Image();
        img.src = u.img;
        images[u.id] = img;
    });
}

class Game {
    constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.canvas.width = window.innerWidth - 120;
        this.canvas.height = window.innerHeight;

        this.gold = 300;
        this.incomeLevel = 1;
        this.baseHp = 1000;
        this.units = [];
        this.enemies = [];
        
        // 超級武器 (紅色警戒機制)
        this.superWeaponCD = 60; // 60秒冷卻
        this.superWeaponTimer = 0;

        this.path = [
            {x: 50, y: 100}, {x: 700, y: 100}, {x: 700, y: 350}, {x: 100, y: 350}, {x: 100, y: 600}, {x: 800, y: 600}
        ];

        loadImages();
        this.lastTime = performance.now();
        setInterval(() => this.tick(), 1000); // 秒級邏輯
        requestAnimationFrame((t) => this.loop(t));
    }

    tick() {
        // 增加金幣
        this.gold += this.incomeLevel;
        
        // 超級武器計時
        if (this.superWeaponTimer < this.superWeaponCD) {
            this.superWeaponTimer++;
            document.getElementById('super-cd').innerText = (this.superWeaponCD - this.superWeaponTimer) + "s";
        } else {
            document.getElementById('super-btn').disabled = false;
            document.getElementById('super-weapon-alert').style.display = 'block';
        }

        // 定期生成敵人
        this.spawnEnemy();
    }

    spawnUnit(id) {
        const data = ASSETS.friendlies.find(u => u.id === id);
        if (this.gold >= data.cost) {
            this.gold -= data.cost;
            this.units.push(new Unit(data, 'friendly', this.path.length - 1, this.path));
        }
    }

    upgradeIncome() {
        const cost = this.incomeLevel * 500;
        if (this.gold >= cost) {
            this.gold -= cost;
            this.incomeLevel++;
            document.getElementById('income-rate').innerText = this.incomeLevel;
            document.getElementById('upgrade-cost').innerText = (this.incomeLevel * 500);
        }
    }

    fireSuperWeapon() {
        // 屁眼大砲：閃電風暴效果 (紅色警戒)
        this.enemies.forEach(e => e.hp -= 200);
        this.superWeaponTimer = 0;
        document.getElementById('super-btn').disabled = true;
        document.getElementById('super-weapon-alert').style.display = 'none';
        
        // 視覺特效：震動與閃光
        this.flashEffect = 10;
    }

    spawnEnemy() {
        const type = Math.random() > 0.1 ? ASSETS.enemies[Math.floor(Math.random()*4)] : ASSETS.enemies[4]; // 10% 機率出 Boss 
        this.enemies.push(new Unit(type, 'enemy', 0, this.path));
    }

    update(dt) {
        document.getElementById('gold').innerText = Math.floor(this.gold);
        document.getElementById('hp').innerText = Math.max(0, Math.ceil(this.baseHp / 10));

        this.units.forEach(u => u.update(dt, this.enemies));
        this.enemies.forEach(e => {
            e.update(dt, this.units);
            // 檢查是否到達我方基地
            if (e.pIdx === this.path.length - 1 && e.distToTarget < 10) {
                this.baseHp -= 10;
                e.hp = 0; // 消失
            }
        });

        this.units = this.units.filter(u => u.hp > 0);
        this.enemies = this.enemies.filter(e => {
            if (e.hp <= 0) this.gold += (e.data.reward || 10);
            return e.hp > 0;
        });
    }

    draw() {
        if (this.flashEffect > 0) {
            this.ctx.fillStyle = `rgba(255,255,255,${this.flashEffect/10})`;
            this.ctx.fillRect(0,0,this.canvas.width, this.canvas.height);
            this.flashEffect--;
        } else {
            this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        }

        // 畫路徑
        this.ctx.strokeStyle = "#444";
        this.ctx.lineWidth = 40;
        this.ctx.beginPath();
        this.ctx.moveTo(this.path[0].x, this.path[0].y);
        this.path.forEach(p => this.ctx.lineTo(p.x, p.y));
        this.ctx.stroke();

        this.units.forEach(u => u.draw(this.ctx));
        this.enemies.forEach(e => e.draw(this.ctx));
    }

    loop(t) {
        const dt = t - this.lastTime;
        this.lastTime = t;
        this.update(dt);
        this.draw();
        requestAnimationFrame((t) => this.loop(t));
    }
}

class Unit {
    constructor(data, side, pIdx, path) {
        this.data = data;
        this.hp = data.hp;
        this.maxHp = data.hp;
        this.side = side;
        this.pIdx = pIdx;
        this.path = path;
        this.x = path[pIdx].x;
        this.y = path[pIdx].y;
        this.targetIdx = side === 'enemy' ? 1 : path.length - 2;
        
        // 星海爭霸機制：能量護盾 (只有騎士有)
        if (data.hasShield) {
            this.shield = 50;
            this.maxShield = 50;
        }

        this.atkTimer = 0;
    }

    update(dt, enemies) {
        // 護盾回升 (星海爭霸)
        if (this.shield < this.maxShield) this.shield += 0.05;

        let target = enemies.find(e => Math.hypot(e.x - this.x, e.y - this.y) < this.data.range);
        
        if (target) {
            this.atkTimer += dt;
            if (this.atkTimer > 1000) {
                target.takeDamage(this.data.atk);
                this.atkTimer = 0;
            }
        } else {
            // 移動
            const tgt = this.path[this.targetIdx];
            const dist = Math.hypot(tgt.x - this.x, tgt.y - this.y);
            this.distToTarget = dist;
            if (dist < 5) {
                this.pIdx = this.targetIdx;
                this.targetIdx += (this.side === 'enemy' ? 1 : -1);
            } else {
                this.x += (tgt.x - this.x) / dist * this.data.speed;
                this.y += (tgt.y - this.y) / dist * this.data.speed;
            }
        }
    }

    takeDamage(dmg) {
        if (this.shield > 0) {
            this.shield -= dmg;
            if (this.shield < 0) { this.hp += this.shield; this.shield = 0; }
        } else {
            this.hp -= dmg;
        }
    }

    draw(ctx) {
        const img = images[this.data.id];
        if (img && img.complete) {
            ctx.drawImage(img, this.x - 20, this.y - 20, 40, 40);
        } else {
            ctx.fillStyle = this.side === 'friendly' ? 'blue' : 'red';
            ctx.beginPath(); ctx.arc(this.x, this.y, 15, 0, Math.PI*2); ctx.fill();
        }

        // 血條
        ctx.fillStyle = "red"; ctx.fillRect(this.x - 20, this.y - 30, 40, 4);
        ctx.fillStyle = "#0f0"; ctx.fillRect(this.x - 20, this.y - 30, 40 * (this.hp/this.maxHp), 4);
        
        // 護盾條 (星海爭霸藍色條)
        if (this.shield > 0) {
            ctx.fillStyle = "#00ffff"; ctx.fillRect(this.x - 20, this.y - 35, 40 * (this.shield/this.maxShield), 3);
        }
    }
}

const game = new Game();
</script>
</body>
</html>
