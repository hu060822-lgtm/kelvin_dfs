<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft 成就大挑戰</title>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <style>
        :root {
            --mc-green: #5AA73E;
            --mc-dirt: #795548;
            --mc-stone: #313131;
            --mc-white: #f0f0f0;
        }

        body {
            background-color: #1e1e1e;
            color: white;
            font-family: 'ZCOOL KuaiLe', 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        #game-container {
            background-color: var(--mc-stone);
            border: 4px solid #000;
            padding: 20px;
            width: 90%;
            max-width: 500px;
            text-align: center;
            box-shadow: 10px 10px 0px rgba(0,0,0,0.5);
        }

        .header {
            color: var(--mc-green);
            font-size: 2rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px #000;
        }

        .score-board {
            margin-bottom: 20px;
            font-size: 1.2rem;
        }

        .question-box {
            background: #4a4a4a;
            padding: 15px;
            border: 2px solid #fff;
            margin-bottom: 20px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn {
            background-color: var(--mc-dirt);
            border: 3px solid #000;
            color: white;
            padding: 15px 10px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn:hover {
            background-color: #8d6e63;
            transform: scale(1.02);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .correct { background-color: var(--mc-green) !important; }
        .wrong { background-color: #ff5555 !important; }

        #next-btn {
            margin-top: 20px;
            padding: 10px 30px;
            background: #5555ff;
            display: none;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div class="header">MC 成就挑戰</div>
        <div class="score-board">分數: <span id="score">0</span> | 剩餘生命: <span id="lives">❤❤❤</span></div>
        
        <div id="quiz-area">
            <div class="question-box">
                <h3 id="question">載入中...</h3>
            </div>
            <div class="options-grid" id="options">
                </div>
        </div>

        <button id="next-btn" class="btn" onclick="nextQuestion()">下一題</button>
    </div>

    <script>
       const quizData = [
    { q: "成就「這是一隻鳥嗎？」如何達成？", a: "使用鞘翅以超音速飛過只有 1x1 大小的空隙", o: ["使用鞘翅飛行超過 1000 米", "使用鞘翅以超音速飛過只有 1x1 大小的空隙", "從世界頂端飛到基岩層", "在鞘翅飛行時殺死一隻幻翼"] },
    { q: "成就「成雙成對」的要求是什麼？", a: "讓每一種動物都進行過繁殖", o: ["讓兩隻羊繁殖", "讓兩隻牛繁殖", "讓每一種動物都進行過繁殖", "同時擁有所有種類的貓"] },
    { q: "成就「終極奉獻」需要哪種工具？", a: "一柄獄髓鋤頭", o: ["一柄鑽石鎬", "一柄獄髓劍", "一柄獄髓鋤頭", "一柄附魔滿級的斧頭"] },
    { q: "成就「這又是哪來的？」如何達成？", a: "受到界伏龍的效果影響向上飄浮 50 格", o: ["進入終界城", "受到界伏龍的效果影響向上飄浮 50 格", "殺死一隻界伏龍", "在終界城使用傳送珍珠"] },
    { q: "成就「為什麼會變成這樣？」需要獲得？", a: "同時獲得每一種藥水與生物效果", o: ["喝下一瓶劇毒藥水", "同時獲得每一種藥水與生物效果", "同時獲得 10 種正面藥水效果", "在半顆心狀態下擊敗凋零怪"] },
    { q: "成就「狂暴雞尾酒」與「為什麼會變成這樣？」的區別在於？", a: "後者包含了如『發光』或『界伏龍潛影』等非藥水效果", o: ["前者只需要喝下投擲藥水", "後者包含了如『發光』或『界伏龍潛影』等非藥水效果", "前者不需要包含負面效果", "兩者其實完全一樣，只是版本翻譯問題"] },
    { q: "成就「正中紅心」的要求是在多遠距離擊中靶心？", a: "30 公尺（格）以外", o: ["20 公尺（格）以外", "30 公尺（格）以外", "50 公尺（格）以外", "100 公尺（格）以外"] },
    { q: "成就「狙擊手的對決」要求殺死 50 米外的哪種生物？", a: "骷髏", o: ["苦力怕", "骷髏", "終界使者", "幻翼"] },
    { q: "成就「不穩定的同盟」如何達成？", a: "將幽靈從地獄帶回主世界並殺死它", o: ["與豬布林進行交易", "將幽靈從地獄帶回主世界並殺死它", "在主世界召喚凋零怪", "讓幽靈的火球炸死一隻苦力怕"] },
    { q: "成就「空間泡沫」要求透過地獄旅行，回到主世界哪處？", a: "距離出發點 7 公里的地方", o: ["距離出發點 1 公里的地方", "距離出發點 7 公里的地方", "距離出發點 10 公里的地方", "世界的邊界"] },
    { q: "成就「兩鳥一石」需要用什麼武器達成？", a: "附有穿透效果的十字弓", o: ["附有力量 V 的長弓", "附有穿透效果的十字弓", "三叉戟", "獄髓劍"] },
    { q: "成就「星際商人」要求在建築高度限制處與村民交易，高度是？", a: "319 層", o: ["256 層", "319 層", "384 層", "512 層"] },
    { q: "成就「荒野醫生」需要對殭屍村民施加什麼？", a: "虛弱藥水與金蘋果", o: ["再生藥水與金蘋果", "虛弱藥水與普通蘋果", "虛弱藥水與金蘋果", "力量藥水與金胡蘿蔔"] },
    { q: "成就「音效之聲」要求在什麼地方播放唱片機？", a: "草甸 (Meadow) 生物群系", o: ["森林 (Forest) 生物群系", "繁茂洞窟 (Lush Caves)", "草甸 (Meadow) 生物群系", "終界城中心"] },
    { q: "成就「均衡飲食」要求吃下所有能吃的東西，包含？", a: "腐肉、河豚與附魔金蘋果", o: ["只有所有的熟食", "不包含生肉和腐肉", "腐肉、河豚與附魔金蘋果", "不包含有毒的東西"] },
    { q: "成就「走在冰上」需要哪種附魔魔咒？", a: "冰行者 (Frost Walker)", o: ["深海探索者 (Depth Strider)", "冰行者 (Frost Walker)", "絲綢之觸 (Silk Touch)", "護甲穿透"] },
    { q: "成就「當頭對面」的要求是？", a: "用幽靈的火球殺死幽靈自己", o: ["用劍格擋火球", "用幽靈的火球殺死幽靈自己", "在幽靈發射前殺死它", "用弓箭射中幽靈的頭"] },
    { q: "成就「生日快樂」要求哪種生物幫你丟蛋糕？", a: "悅靈 (Allay)", o: ["村民 (Villager)", "悅靈 (Allay)", "鸚鵡 (Parrot)", "狐狸 (Fox)"] },
    { q: "成就「戰略性捕魚」要求用什麼捕魚？", a: "水桶", o: ["釣魚竿", "三叉戟", "水桶", "手動擊殺"] },
    { q: "成就「在此避難」要求進入哪種結構？", a: "堡壘遺跡 (Bastion Remnant)", o: ["要塞 (Stronghold)", "林地府邸 (Woodland Mansion)", "地獄要塞 (Nether Fortress)", "堡壘遺跡 (Bastion Remnant)"] }
];
        let currentIdx = 0;
        let score = 0;
        let lives = 3;

        function initQuiz() {
            const data = quizData[currentIdx];
            document.getElementById('question').innerText = data.q;
            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = '';
            
            // 打亂選項順序
            const shuffledOptions = [...data.o].sort(() => Math.random() - 0.5);

            shuffledOptions.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(btn, opt);
                optionsDiv.appendChild(btn);
            });
            document.getElementById('next-btn').style.display = 'none';
        }

        function checkAnswer(btn, choice) {
            const correct = quizData[currentIdx].a;
            const allBtns = document.querySelectorAll('.options-grid .btn');
            
            allBtns.forEach(b => b.style.pointerEvents = 'none');

            if (choice === correct) {
                btn.classList.add('correct');
                score += 10;
                document.getElementById('score').innerText = score;
            } else {
                btn.classList.add('wrong');
                lives--;
                updateLives();
                // 顯示正確答案
                allBtns.forEach(b => { if(b.innerText === correct) b.classList.add('correct'); });
            }

            if (lives > 0) {
                document.getElementById('next-btn').style.display = 'block';
            } else {
                alert("遊戲結束！最終得分：" + score);
                location.reload();
            }
        }

        function updateLives() {
            document.getElementById('lives').innerText = "❤".repeat(lives);
        }

        function nextQuestion() {
            currentIdx++;
            if (currentIdx < quizData.length) {
                initQuiz();
            } else {
                alert("恭喜通關！你是成就大師！");
                location.reload();
            }
        }

        initQuiz();
    </script>
</body>
</html>
