<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>岩壁群友情大考驗 💖</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Microsoft JhengHei', sans-serif;
            background-color: #ffe6f0;
            color: #d14777;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            background-color: #ff99c2;
            width: 100%;
            padding: 20px 0;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        h1 {
            margin: 0;
            color: white;
            font-size: 2.2em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            letter-spacing: 2px;
        }
        .quiz-container {
            background-color: white;
            width: 85%;
            max-width: 800px;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 15px rgba(255, 153, 194, 0.3);
            margin-bottom: 50px;
            position: relative;
        }
        .question-block {
            display: none; 
        }
        .question-block.active {
            display: block;
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        h2.question-title {
            border-bottom: 2px dashed #ffb3d1;
            padding-bottom: 15px;
            margin-bottom: 20px;
            line-height: 1.5;
            font-size: 1.4em;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .option-btn {
            background-color: #fff0f5;
            border: 2px solid #ffb3d1;
            padding: 15px;
            border-radius: 10px;
            font-size: 1.1em;
            color: #d14777;
            cursor: pointer;
            transition: all 0.3s;
            text-align: left;
        }
        .option-btn:hover {
            background-color: #ffb3d1;
            color: white;
        }
        .option-btn.selected {
            background-color: #ff66a3;
            border-color: #ff66a3;
            color: white;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(255, 102, 163, 0.3);
        }
        .controls {
            margin-top: 30px;
            display: flex;
            justify-content: space-between;
        }
        button.nav-btn {
            background-color: #ff66a3;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            font-size: 1.1em;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: 0.3s;
        }
        button.nav-btn:hover {
            background-color: #ff4d94;
            transform: translateY(-2px);
        }
        button.nav-btn:disabled {
            background-color: #ffcce0;
            cursor: not-allowed;
            transform: translateY(0);
        }
        .progress {
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
            color: #ff66a3;
            font-size: 1.1em;
        }
        .result-container {
            display: none;
            text-align: center;
            animation: fadeIn 0.8s ease-in-out;
        }
        .result-container h2 {
            font-size: 2.5em;
            margin-bottom: 10px;
            color: #ff4d94;
        }
        .result-container p {
            font-size: 1.3em;
            line-height: 1.6;
        }
        .score-display {
            font-size: 4em;
            font-weight: bold;
            color: #ff66a3;
            margin: 20px 0;
            text-shadow: 2px 2px 0px #ffe6f0;
        }
        .restart-btn {
            margin-top: 30px;
            background-color: #ff99c2;
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 1.3em;
            cursor: pointer;
            transition: 0.3s;
        }
        .restart-btn:hover {
            background-color: #ff66a3;
        }
        .intro {
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.2em;
        }
    </style>
</head>
<body>

<header>
    <h1>✨ 岩壁群友情大考驗 ✨</h1>
</header>

<div class="quiz-container" id="quiz-container">
    <div class="intro" id="intro-block">
        <p>你有多了解這個伺服器裡的大家？<br>20題來自聊天紀錄的靈魂拷問，測測你是真朋友還是假兄弟！💖</p>
        <button class="nav-btn" onclick="startQuiz()" style="margin-top: 20px; font-size: 1.2em;">開始測驗 🚀</button>
    </div>

    <div id="questions-wrapper">
        </div>

    <div class="controls" id="controls" style="display: none;">
        <button class="nav-btn" id="prev-btn" onclick="prevQuestion()">⬅️ 上一題</button>
        <button class="nav-btn" id="next-btn" onclick="nextQuestion()">下一題 ➡️</button>
        <button class="nav-btn" id="submit-btn" onclick="showResults()" style="display: none; background-color: #ff4d94;">提交看結果 🌟</button>
    </div>
    
    <div class="progress" id="progress" style="display: none;">
        進度：<span id="current-q">1</span> / 20
    </div>
</div>

<div class="quiz-container result-container" id="result-container">
    <h2>測驗結束！🎉</h2>
    <div class="score-display" id="score-display">100</div>
    <p id="result-message">評語加載中...</p>
    <button class="restart-btn" onclick="location.reload()">再玩一次 🔄</button>
</div>

<script>
    const quizData = [
        {
            question: "2024年8月，是誰在群組裡問了「諸位有推薦的台中餐廳口袋名單嗎」？",
            options: ["A. 一尾熊", "B. 二尾熊", "C. 三尾熊", "D. 四尾熊", "E. 七尾熊"],
            answer: 4
        },
        {
            question: "討論到去「起家雞南屯店」吃東西時，是誰殘酷地提醒大家「這間好像沒有內用」？",
            options: ["A. 一尾熊", "B. 二尾熊", "C. 三尾熊", "D. 無尾熊", "E. 七尾熊"],
            answer: 2
        },
        {
            question: "誰曾經發問「女生跟男生說自己月經來，男生到底要回啥」，並表示自己回了『真巧，我早上也夢遺』然後就被封鎖了？",
            options: ["A. 一尾熊", "B. 二尾熊", "C. 三尾熊", "D. 負一尾熊", "E. AllenLin"],
            answer: 0
        },
        {
            question: "誰在聊天中開心地宣稱「剛剛發現我的租屋補助是給4000，我房租4000，有住跟沒住一樣好爽」？",
            options: ["A. 負一尾熊", "B. 托沃·卡普", "C. 無尾熊", "D. AllenLin", "E. 二尾熊"],
            answer: 4
        },
        {
            question: "二尾熊曾經夢到自己變成哪一隻賽馬，去參加森林系的吃到飽比賽之後，還去打棒球覺得超爽？",
            options: ["A. 特別週", "B. 神鷹", "C. 草上飛", "D. 櫻花驀進王", "E. 東海帝王"],
            answer: 3
        },
        {
            question: "當七尾熊對無尾熊深情告白說「我只是想看看你」之後，無尾熊給出的回應是什麼？",
            options: ["A. 你可以看我視訊", "B. 噁心，滾", "C. 等我一下，我洗個澡", "D. 給我錢", "E. 我要報警了"],
            answer: 0
        },
        {
            question: "誰在群組裡發出了「雖然今天一整天都沒吃東西，但幫她吃了半個漢堡還是蠻撐的」這種充滿戀愛酸臭味的言論？",
            options: ["A. 一尾熊", "B. 二尾熊", "C. 三尾熊", "D. 無尾熊", "E. 七尾熊"],
            answer: 2
        },
        {
            question: "在聊天記錄中，誰曾自稱是「小綠」？",
            options: ["A. 三尾熊", "B. 一尾熊", "C. 四尾熊", "D. 負一尾熊", "E. 二尾熊"],
            answer: 1
        },
        {
            question: "誰曾在群組中用超嚴肅的英文強烈譴責大家：「I vehemently denounce all individuals who have failed to purchase R.E.P.O.」？",
            options: ["A. 一尾熊", "B. 二尾熊", "C. 負一尾熊", "D. 無尾熊", "E. 七尾熊"],
            answer: 1
        },
        {
            question: "關於「十週年是十歲生日還是十一歲生日」的疑問，三尾熊的神邏輯給出了什麼答案？",
            options: ["A. 十歲生日", "B. 十一歲生日", "C. 二十歲生日", "D. 七十歲生日", "E. 三千六百四十歲生日"],
            answer: 3
        },
        {
            question: "二尾熊曾經胡謅了一段關於「張紘瑞」的生平，在此設定中他出生於哪一個朝代，並且自稱屁眼人？",
            options: ["A. 漢朝", "B. 宋朝", "C. 唐朝", "D. 明朝", "E. 清朝"],
            answer: 2
        },
        {
            question: "在討論某個機率與排列組合的問題時，負一尾熊給出的超譯神解釋是「因為____，所以9個裡面隨便抓兩個就好了」？",
            options: ["A. 運氣好", "B. 長相問題", "C. 萬物皆空", "D. 性別平等", "E. 隨便啦"],
            answer: 3
        },
        {
            question: "有人在群組裡說「我的名子是牛奶巧克力」，這個人是誰？",
            options: ["A. 一尾熊", "B. 二尾熊", "C. 三尾熊", "D. 四尾熊", "E. 負一尾熊"],
            answer: 1
        },
        {
            question: "無尾熊在半夜兩點半抱怨「根本下不了旗，幹還有兩個傻逼沒走是怎樣」之後，他最後做了什麼決定？",
            options: ["A. 繼續下棋到天亮", "B. 把電腦砸了", "C. 選擇早起下棋", "D. 放棄去睡覺", "E. 跑去吃麥當勞"],
            answer: 2
        },
        {
            question: "誰在群組中突然科普了1973年發生的「帕斯卡古拉事件(Pascagoula Abduction)」外星人綁架案，還問寶傑怎麼看？",
            options: ["A. 一尾熊", "B. 二尾熊", "C. 三尾熊", "D. 四尾熊", "E. 山勞贖"],
            answer: 1
        },
        {
            question: "曾經有一次無尾熊氣噗噗地說「我生氣了」，是因為他想做什麼事卻沒有人陪他？",
            options: ["A. 玩英雄聯盟", "B. 買宵夜", "C. 唱歌", "D. 玩原神", "E. 出去跳舞"],
            answer: 4
        },
        {
            question: "一尾熊在群組裡問了一句「版本t0還要t5教，你要不要臉」，結果被誰神回覆「搞雜交朋友了」？",
            options: ["A. 七尾熊", "B. 二尾熊", "C. 三尾熊", "D. 負一尾熊", "E. 無尾熊"],
            answer: 1
        },
        {
            question: "二尾熊貼出《Tools Up!》的Steam遊戲網址後，他隨後悲從中來地問了一句什麼話？",
            options: ["A. 誰要陪我玩", "B. 這遊戲好爛", "C. 為什麼要付錢", "D. do i have friends", "E. 幫我買"],
            answer: 3
        },
        {
            question: "某次有人貼出「侯友宜：若當選將恢復學校教育學生禮義廉恥」的新聞，一尾熊的第一反應是？",
            options: ["A. 沒料", "B. 讚喔", "C. 哈哈", "D. 確實", "E. 太神啦"],
            answer: 0
        },
        {
            question: "某天二尾熊在群組宣稱「我是____」，並搭配了書呆子跟指著上面的Emoji，這個稱號是什麼？",
            options: ["A. 邊緣人", "B. 單身狗", "C. 櫻花驀進王", "D. 帥哥", "E. 身心障礙者"],
            answer: 4
        }
    ];

    let currentQuestionIndex = 0;
    let userAnswers = new Array(quizData.length).fill(null);

    const wrapper = document.getElementById('questions-wrapper');
    const controls = document.getElementById('controls');
    const progress = document.getElementById('progress');
    const introBlock = document.getElementById('intro-block');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const submitBtn = document.getElementById('submit-btn');

    function initQuiz() {
        quizData.forEach((q, index) => {
            const block = document.createElement('div');
            block.className = 'question-block';
            block.id = `question-${index}`;
            
            const title = document.createElement('h2');
            title.className = 'question-title';
            title.textContent = `Q${index + 1}. ${q.question}`;
            block.appendChild(title);

            const optionsDiv = document.createElement('div');
            optionsDiv.className = 'options';

            q.options.forEach((opt, optIndex) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = opt;
                btn.onclick = () => selectOption(index, optIndex, btn);
                optionsDiv.appendChild(btn);
            });

            block.appendChild(optionsDiv);
            wrapper.appendChild(block);
        });
    }

    function startQuiz() {
        introBlock.style.display = 'none';
        controls.style.display = 'flex';
        progress.style.display = 'block';
        showQuestion(0);
    }

    function showQuestion(index) {
        document.querySelectorAll('.question-block').forEach(el => el.classList.remove('active'));
        document.getElementById(`question-${index}`).classList.add('active');
        document.getElementById('current-q').textContent = index + 1;
        
        prevBtn.disabled = index === 0;

        if (index === quizData.length - 1) {
            nextBtn.style.display = 'none';
            submitBtn.style.display = 'block';
        } else {
            nextBtn.style.display = 'block';
            submitBtn.style.display = 'none';
        }
    }

    function selectOption(qIndex, optIndex, btnElement) {
        userAnswers[qIndex] = optIndex;
        const siblings = btnElement.parentElement.children;
        for (let sibling of siblings) {
            sibling.classList.remove('selected');
        }
        btnElement.classList.add('selected');
    }

    function nextQuestion() {
        if (userAnswers[currentQuestionIndex] === null) {
            alert("你還沒選答案喔！不准跳過！😎");
            return;
        }
        if (currentQuestionIndex < quizData.length - 1) {
            currentQuestionIndex++;
            showQuestion(currentQuestionIndex);
        }
    }

    function prevQuestion() {
        if (currentQuestionIndex > 0) {
            currentQuestionIndex--;
            showQuestion(currentQuestionIndex);
        }
    }

    function showResults() {
        if (userAnswers[currentQuestionIndex] === null) {
            alert("最後一題還沒選喔！😎");
            return;
        }

        let score = 0;
        quizData.forEach((q, i) => {
            if (userAnswers[i] === q.answer) {
                score += 5; // 一題5分，總分100
            }
        });

        document.getElementById('quiz-container').style.display = 'none';
        const resultContainer = document.getElementById('result-container');
        resultContainer.style.display = 'block';
        document.getElementById('score-display').textContent = `${score} 分`;

        let msg = "";
        if (score === 100) {
            msg = "太神啦！你根本是住在伺服器裡的守護靈吧！💯💖";
        } else if (score >= 80) {
            msg = "超猛！你絕對是群組裡的超級骨幹，什麼八卦都逃不過你的法眼！😎✨";
        } else if (score >= 60) {
            msg = "還不錯啦！算是有在關心大家，但有時候可能在潛水喔！🐢💦";
        } else if (score >= 40) {
            msg = "哎呀...你是不是都把伺服器靜音了？快去翻翻歷史紀錄啦！🥲🔍";
        } else {
            msg = "抓到了！你根本就是雲友誼！連大家昨天講了什麼幹話都不知道！😱💔";
        }
        document.getElementById('result-message').innerHTML = msg;
    }

    // 初始化測驗
    initQuiz();
</script>

</body>
</html>
