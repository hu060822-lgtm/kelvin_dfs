<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>老闆的壓迫：極限彈幕遊戲</title>
    <style>
        body { margin: 0; background: #000; color: white; font-family: sans-serif; overflow: hidden; }
        canvas { display: block; margin: 0 auto; background: #111; box-shadow: 0 0 20px rgba(255,255,255,0.2); }
        #ui { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; width: 100%; }
        .hero-select { display: flex; justify-content: center; gap: 20px; margin-top: 20px; }
        .hero-card { border: 2px solid #555; padding: 10px; cursor: pointer; transition: 0.3s; width: 120px; }
        .hero-card:hover { border-color: #fff; background: #222; }
        .hero-card img { width: 100px; height: 100px; object-fit: cover; border-radius: 50%; }
        .hidden { display: none; }
        #hud { position: absolute; top: 10px; left: 10px; pointer-events: none; }
        #skill-bar { width: 200px; height: 10px; background: #333; margin-top: 5px; }
        #skill-fill { width: 100%; height: 100%; background: #0cf; transition: 0.1s; }
    </style>
</head>
<body>

    <div id="hud" class="hidden">
        <div>HP: <span id="hp-val">3</span></div>
        <div>SKILL (SPACE):</div>
        <div id="skill-bar"><div id="skill-fill"></div></div>
    </div>

    <div id="ui">
        <h1>老闆的壓迫：極限彈幕</h1>
        <p>選擇你的英雄進入戰場</p>
        <div class="hero-select">
            <div class="hero-card" onclick="startGame('hero_1', '護盾')">
                <img src="hero_1.jpg">
                <p>工程師<br><small>技能：護盾</small></p>
            </div>
            <div class="hero-card" onclick="startGame('hero_2', '子彈時間')">
                <img src="hero_2.jpg">
                <p>眼鏡兄<br><small>技能：時間緩速</small></p>
            </div>
            <div class="hero-card" onclick="startGame('hero_3', '追蹤雷射')">
                <img src="hero_3.jpg">
                <p>大頭<br><small>技能：全彈發射</small></p>
            </div>
            <div class="hero-card" onclick="startGame('hero_4', '瞬移')">
                <img src="hero_4.jpg">
                <p>微笑哥<br><small>技能：隨機閃現</small></p>
            </div>
            <div class="hero-card" onclick="startGame('hero_5', '淨化')">
                <img src="hero_5.png">
                <p>墨鏡男<br><small>技能：全屏清除</small></p>
            </div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 800;
        canvas.height = 800;

        let gameActive = false;
        let player, boss, bullets = [], particles = [], frame = 0;
        let keys = {};
        let skillCooldown = 0;

        const images = {
            boss: 'boss.jpg',
            enemies: ['enemy_1.jpg', 'enemy_2.jpg', 'enemy_3.png', 'enemy_4.jpg']
        };

        const bossImg = new Image(); bossImg.src = images.boss;
        const enemyImgs = images.enemies.map(src => {
            const img = new Image(); img.src = src; return img;
        });

        class Entity {
            constructor(x, y, radius, img) {
                this.x = x; this.y = y; this.radius = radius; this.img = img;
            }
            draw() {
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
                ctx.clip();
                ctx.drawImage(this.img, this.x - this.radius, this.y - this.radius, this.radius*2, this.radius*2);
                ctx.restore();
            }
        }

        function startGame(heroId, skillName) {
            document.getElementById('ui').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            
            const pImg = new Image(); pImg.src = heroId + (heroId === 'hero_5' ? '.png' : '.jpg');
            player = new Entity(400, 700, 20, pImg);
            player.hp = 3;
            player.skill = skillName;
            
            boss = new Entity(400, 150, 80, bossImg);
            boss.hp = 1000;
            
            gameActive = true;
            animate();
        }

        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        function spawnBullet(x, y, vx, vy, type) {
            bullets.push({ x, y, vx, vy, radius: 10, img: enemyImgs[Math.floor(Math.random()*4)] });
        }

        function useSkill() {
            if (skillCooldown > 0) return;
            skillCooldown = 500; // 500 frames cooldown

            if (player.skill === '全屏清除') bullets = [];
            if (player.skill === '護盾') player.invincible = 180; // 3 seconds
            if (player.skill === '隨機閃現') { player.x = Math.random()*800; player.y = Math.random()*800; }
        }

        function update() {
            if (keys['ArrowUp'] && player.y > 0) player.y -= 5;
            if (keys['ArrowDown'] && player.y < 800) player.y += 5;
            if (keys['ArrowLeft'] && player.x > 0) player.x -= 5;
            if (keys['ArrowRight'] && player.x < 800) player.x += 5;
            if (keys['Space']) useSkill();

            if (skillCooldown > 0) skillCooldown--;
            if (player.invincible > 0) player.invincible--;
            document.getElementById('skill-fill').style.width = (1 - skillCooldown/500)*100 + '%';

            // Boss AI & Patterns
            frame++;
            boss.x = 400 + Math.sin(frame/50) * 200;

            // Pattern 1: Spiral
            if (frame % 5 === 0) {
                let angle = frame / 10;
                spawnBullet(boss.x, boss.y, Math.cos(angle)*4, Math.sin(angle)*4);
            }

            // Pattern 2: Heavy Rain (Difficulty)
            if (frame % 20 === 0) {
                for(let i=0; i<8; i++) spawnBullet(Math.random()*800, 0, 0, 3 + Math.random()*5);
            }

            bullets.forEach((b, index) => {
                b.x += b.vx;
                b.y += b.vy;

                // Collision Detection
                let dist = Math.hypot(player.x - b.x, player.y - b.y);
                if (dist < player.radius + b.radius && !player.invincible) {
                    player.hp--;
                    document.getElementById('hp-val').innerText = player.hp;
                    bullets.splice(index, 1);
                    if (player.hp <= 0) location.reload();
                }
                if (b.y > 850 || b.y < -50 || b.x > 850 || b.x < -50) bullets.splice(index, 1);
            });
        }

        function animate() {
            if (!gameActive) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            update();
            
            // Draw Boss HP Bar
            ctx.fillStyle = 'red';
            ctx.fillRect(100, 20, 600, 10);
            
            boss.draw();
            player.draw();
            if (player.invincible > 0) {
                ctx.strokeStyle = 'cyan'; ctx.lineWidth = 5;
                ctx.beginPath(); ctx.arc(player.x, player.y, player.radius + 5, 0, Math.PI*2); ctx.stroke();
            }

            bullets.forEach(b => {
                ctx.save();
                ctx.beginPath(); ctx.arc(b.x, b.y, b.radius, 0, Math.PI*2); ctx.clip();
                ctx.drawImage(b.img, b.x - b.radius, b.y - b.radius, b.radius*2, b.radius*2);
                ctx.restore();
            });

            requestAnimationFrame(animate);
        }
    </script>
</body>
</html>
